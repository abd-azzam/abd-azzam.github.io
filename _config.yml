# ============================================================
# Site settings — edit these first.
# ============================================================
title: "Abdullah Azzam"
description: "Abdullah Azzam is an M.A. student in Political Science at Universitas Islam Internasional Indonesia (UIII), writing a thesis on whether deindustrialization breeds state capitalism."

# GitHub Pages user site: the repository abd-azzam/abd-azzam.github.io is served
# at the root of https://abd-azzam.github.io, so baseurl stays empty.
url: "https://abd-azzam.github.io"
baseurl: ""

# Shown in the sidebar.
author:
  name: "Abdullah Azzam"
  role: "M.A. Student, Political Science"
  department: "Faculty of Social Sciences"
  department_url: "https://foss.uiii.ac.id/"
  institution: "Universitas Islam Internasional Indonesia (UIII)"
  institution_url: "https://uiii.ac.id/"
  email: "abdullah.azzam@students.uiii.ac.id"
  email_alt: "abdazzam@protonmail.com"
  scholar: "https://scholar.google.com/citations?user=0buaHv0AAAAJ"
  linkedin: "https://www.linkedin.com/in/abd-azzam"
  github: "https://github.com/abd-azzam"
  x: "https://x.com/aFabiusMaximus"

# Claim Viewer, shown on the home page and the Side Projects page. The installer
# link is built from the version: <repo_url>/releases/download/v<version>/ClaimViewer-Setup-<version>.exe
# When you publish a new release on GitHub, change `version` here and both pages follow.
claim_viewer:
  version: "2.6.3"
  repo_url: "https://github.com/abd-azzam/Claim-Viewer"

markdown: kramdown
permalink: ":basename:output_ext"
theme: null

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .github/
  - .gitignore
  - .gitattributes
  - .DS_Store

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
