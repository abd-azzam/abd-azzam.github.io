title: "Abdullah Azzam"
description: "Abdullah Azzam is a graduate student in Political Science at Universitas Islam Internasional Indonesia (UIII) and a policy researcher working on development, the environment, and public policy in Indonesia and the Muslim world."

# GitHub Pages user site: the repository abd-azzam/abd-azzam.github.io is served
# at the root of https://abd-azzam.github.io, so baseurl stays empty.
url: "https://abd-azzam.github.io"
baseurl: ""

# Shown in the sidebar and footer.
author:
  name: "Abdullah Azzam"
  role: "MA Student, Political Science"
  department: "Faculty of Social Sciences"
  department_url: "https://soc.uiii.ac.id/"
  institution: "Universitas Islam Internasional Indonesia (UIII)"
  institution_url: "https://uiii.ac.id/"
  address: "Jl. Raya Bogor KM 33.5, Cisalak, Sukmajaya, Depok, West Java 16416, Indonesia"
  email: "abdullah.azzam@students.uiii.ac.id"
  email_alt: "abdazzam@protonmail.com"
  scholar: "https://scholar.google.com/citations?user=0buaHv0AAAAJ"
  linkedin: "https://www.linkedin.com/in/abd-azzam30/"
  github: "https://github.com/abd-azzam"

markdown: kramdown
permalink: ":basename:output_ext"
theme: null

plugins:
  - jekyll-feed
  - jekyll-redirect-from
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .github/
  - .gitignore
  - .gitattributes
  - .DS_Store

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default
