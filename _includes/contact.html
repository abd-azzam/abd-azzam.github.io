<!-- Profile card: photo, name, affiliation, CV button, then the contact block. -->
<img class="headshot"
     alt="Portrait of {{ site.author.name }}"
     src="{{ '/assets/images/headshot.jpg' | relative_url }}"
     srcset="{{ '/assets/images/headshot-400.jpg' | relative_url }} 400w, {{ '/assets/images/headshot.jpg' | relative_url }} 800w"
     sizes="(min-width: 383px) 333px, calc(100vw - 50px)"
     width="800" height="1000"
     loading="eager" />

<h2>{{ site.author.name }}</h2>

<p class="affiliation">
  {{ site.author.role }}<br />
  <a href="{{ site.author.department_url }}">{{ site.author.department }}</a><br />
  <a href="{{ site.author.institution_url }}">{{ site.author.institution }}</a>
</p>

<p class="cv-button-wrap">
  <a class="cv-button" href="{{ '/cv/CV-Abdullah_Azzam.docx' | relative_url }}">Curriculum Vitae</a>
</p>

<div class="contact-block">
<h3>Reach me at</h3>

    <details class="mail-menu">

      <ul role="list" class="mail-options">
        <li><a href="mailto:{{ site.author.email }}" title="{{ site.author.email }}" aria-label="UIII mail: {{ site.author.email }}">UIII mail</a></li>
        <li><a href="mailto:{{ site.author.email_alt }}" title="{{ site.author.email_alt }}" aria-label="Proton Mail: {{ site.author.email_alt }}">Proton Mail</a></li>

  <li>
