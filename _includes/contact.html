<!--
  Sidebar card: photo, name, affiliation, CV button, social icons.
  Replace assets/images/headshot.jpg with your own photo (square or 4:5 portrait
  works best), then change the src below from headshot.svg to headshot.jpg.
-->
<img class="headshot"
     alt="{{ site.author.name }}"
     src="{{ '/assets/images/headshot.svg' | relative_url }}"
     width="800" height="1000"
     loading="eager" />

<h2>{{ site.author.name }}</h2>

<p class="affiliation">
  {{ site.author.role }}<br />
  <a href="{{ site.author.department_url }}">{{ site.author.department }}</a><br />
  <a href="{{ site.author.institution_url }}">{{ site.author.institution }}</a>
</p>

<p class="contact-emails">
  <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a><br />
  <a href="mailto:{{ site.author.email_alt }}">{{ site.author.email_alt }}</a>
</p>

<p class="cv-button-wrap">
  <a class="cv-button" href="{{ '/cv/azzam-cv.pdf' | relative_url }}">Curriculum Vitae</a>
</p>

<ul role="list" class="social-links">
  <li>
    <a href="mailto:{{ site.author.email }}" title="Email" aria-label="Email">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
        <path d="M2 5.5A1.5 1.5 0 0 1 3.5 4h17A1.5 1.5 0 0 1 22 5.5v13a1.5 1.5 0 0 1-1.5 1.5h-17A1.5 1.5 0 0 1 2 18.5v-13Zm2.2.5 7.8 6 7.8-6H4.2ZM20 8.3l-7.4 5.7a1 1 0 0 1-1.2 0L4 8.3V18h16V8.3Z" />
      </svg>
    </a>
  </li>
  <li>
    <a href="{{ site.author.scholar }}" title="Google Scholar" aria-label="Google Scholar" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
        <path d="M12 2 1 8.5l4.2 2.5v3.1c0 .4.2.7.5.9C7.4 16.1 9.6 17 12 17s4.6-.9 6.3-2c.3-.2.5-.5.5-.9V11L21 9.6V16h2V8.5L12 2Zm0 13.1c-1.9 0-3.7-.6-5.1-1.5v-2.2L12 14.5l5.1-3.1v2.2c-1.4.9-3.2 1.5-5.1 1.5Zm0-3L4.5 8.5 12 4.2l7.5 4.3L12 12.1Z" />
        <circle cx="12" cy="18.5" r="3.2" />
      </svg>
    </a>
  </li>
  <li>
    <a href="{{ site.author.github }}" title="GitHub" aria-label="GitHub" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
        <path d="M12 1.5A10.5 10.5 0 0 0 8.7 22c.5.1.7-.2.7-.5v-1.9c-2.9.6-3.5-1.4-3.5-1.4-.5-1.2-1.2-1.5-1.2-1.5-.9-.6.1-.6.1-.6 1 .1 1.6 1.1 1.6 1.1.9 1.6 2.4 1.1 3 .9.1-.7.4-1.1.7-1.4-2.3-.3-4.8-1.2-4.8-5.2 0-1.2.4-2.1 1.1-2.9-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 2.9 1.1a10 10 0 0 1 5.3 0c2-1.4 2.9-1.1 2.9-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.7 1.1 2.9 0 4-2.5 4.9-4.8 5.2.4.3.7 1 .7 2v3c0 .3.2.6.7.5A10.5 10.5 0 0 0 12 1.5Z" />
      </svg>
    </a>
  </li>
  <li>
    <a href="{{ site.author.linkedin }}" title="LinkedIn" aria-label="LinkedIn" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" role="img" aria-hidden="true" focusable="false">
        <path d="M4.98 3.5A2.5 2.5 0 1 0 5 8.5a2.5 2.5 0 0 0-.02-5ZM3 9.5h4V21H3V9.5Zm6.5 0h3.8v1.6h.05c.53-.95 1.83-1.95 3.76-1.95 4.02 0 4.76 2.5 4.76 5.76V21h-4v-5.3c0-1.27-.02-2.9-1.8-2.9-1.8 0-2.07 1.38-2.07 2.8V21h-4V9.5Z" />
      </svg>
    </a>
  </li>
</ul>
